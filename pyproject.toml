[project]
name = "aum"
version = "0.1.0"
description = "AI Usage Meter — unified plan-quota view for Claude Code, Codex, and GitHub Copilot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eric Schoeller" }]
dependencies = [
    "rich>=13.0",
]

[project.scripts]
aum = "aum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aum"]
